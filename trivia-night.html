<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pack Trivia</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0d;
    --surface: #1a1a1a;
    --text: #f0f0f0;
    --muted: #888;
    --radius: 16px;
    --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }

  html, body {
    height: 100%;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    overscroll-behavior: none;
  }

  /* ── SCREENS ─────────────────────────────────────────── */
  .screen {
    position: fixed;
    inset: 0;
    overflow-y: auto;
    padding: clamp(1.5rem, 4vw, 3rem);
    transition: opacity var(--transition), transform var(--transition);
  }
  .screen.hidden {
    opacity: 0;
    pointer-events: none;
    transform: translateY(24px);
  }
  .screen.slide-out {
    opacity: 0;
    transform: translateY(-24px);
  }

  /* ── THEME SELECTION ─────────────────────────────────── */
  #theme-screen {
    display: flex;
    flex-direction: column;
    min-height: 100%;
  }
  .site-title {
    text-align: center;
    font-size: clamp(2.4rem, 6vw, 4rem);
    font-weight: 900;
    letter-spacing: -1px;
    color: #fff;
    margin-bottom: 0.25em;
    text-shadow: 0 0 40px rgba(255,255,255,0.15);
  }
  .site-subtitle {
    text-align: center;
    font-size: clamp(1rem, 2.5vw, 1.3rem);
    color: var(--muted);
    margin-bottom: clamp(2rem, 5vw, 3.5rem);
    font-weight: 400;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .theme-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: clamp(1rem, 2.5vw, 1.5rem);
    max-width: 800px;
    margin: 0 auto;
    width: 100%;
  }
  .theme-card {
    width: min(360px, 100%);
    background: var(--surface);
    border-radius: var(--radius);
    padding: clamp(1.5rem, 3vw, 2.2rem);
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    position: relative;
    overflow: hidden;
  }
  .theme-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--card-accent, #666);
    opacity: 0.07;
    transition: opacity 0.2s ease;
  }
  .theme-card:hover::before, .theme-card:focus-visible::before {
    opacity: 0.14;
  }
  .theme-card:hover, .theme-card:focus-visible {
    transform: translateY(-4px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    border-color: var(--card-accent, #666);
    outline: none;
  }
  .theme-card:active {
    transform: translateY(-1px);
  }
  .theme-icon {
    font-size: 2.8rem;
    margin-bottom: 0.6rem;
    display: block;
    line-height: 1;
  }
  .theme-name {
    font-size: clamp(1.4rem, 3vw, 1.8rem);
    font-weight: 800;
    color: var(--card-accent, #fff);
    margin-bottom: 0.3rem;
    line-height: 1.15;
  }
  .theme-count {
    font-size: 0.95rem;
    color: var(--muted);
    font-weight: 500;
  }
  .theme-card-arrow {
    position: absolute;
    bottom: 1.2rem;
    right: 1.4rem;
    font-size: 1.4rem;
    color: var(--card-accent, #666);
    opacity: 0;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .theme-card:hover .theme-card-arrow {
    opacity: 1;
    transform: translateX(4px);
  }

  /* ── QUESTION LIST SCREEN ────────────────────────────── */
  #question-screen {
    display: flex;
    flex-direction: column;
    min-height: 100%;
  }
  #question-screen.hidden { transform: translateY(24px); }

  .question-header {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: clamp(1.5rem, 4vw, 2.5rem);
    position: sticky;
    top: 0;
    background: var(--bg);
    padding: 0.75rem 0;
    z-index: 10;
    border-bottom: 1px solid #222;
    margin-left: calc(-1 * clamp(1.5rem, 4vw, 3rem));
    margin-right: calc(-1 * clamp(1.5rem, 4vw, 3rem));
    padding-left: clamp(1.5rem, 4vw, 3rem);
    padding-right: clamp(1.5rem, 4vw, 3rem);
  }
  .back-btn {
    background: none;
    border: 2px solid #333;
    border-radius: 10px;
    color: var(--text);
    font-size: 1rem;
    font-weight: 700;
    padding: 0.5rem 1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .back-btn:hover {
    background: #222;
    border-color: #555;
  }
  .header-theme-name {
    font-size: clamp(1.4rem, 3.5vw, 2rem);
    font-weight: 900;
    color: var(--active-accent, #fff);
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .header-progress {
    font-size: 0.9rem;
    color: var(--muted);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .question-list {
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
    max-width: 860px;
    margin: 0 auto;
    width: 100%;
    padding-bottom: 3rem;
  }

  /* ── QUESTION CARD ───────────────────────────────────── */
  .q-card {
    background: var(--surface);
    border-radius: var(--radius);
    border: 2px solid #252525;
    cursor: pointer;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
    overflow: hidden;
  }
  .q-card:hover {
    border-color: #3a3a3a;
  }
  .q-card.state-question, .q-card.state-answer {
    border-color: var(--active-accent, #666);
    box-shadow: 0 0 0 1px var(--active-accent, #666) inset,
                0 4px 24px rgba(0,0,0,0.4);
  }

  .q-card-inner {
    padding: clamp(1.1rem, 2.5vw, 1.6rem);
  }
  .q-card-top {
    display: flex;
    align-items: flex-start;
    gap: 1rem;
  }
  .q-number {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--active-accent, var(--muted));
    background: rgba(255,255,255,0.06);
    border-radius: 8px;
    padding: 0.25rem 0.6rem;
    white-space: nowrap;
    flex-shrink: 0;
    margin-top: 0.1em;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .q-card.state-question .q-number,
  .q-card.state-answer .q-number {
    background: var(--active-accent, #666);
    color: #000;
  }

  .q-hint {
    font-size: clamp(1rem, 2vw, 1.15rem);
    color: var(--muted);
    font-style: italic;
    padding-top: 0.15em;
    transition: opacity var(--transition);
  }
  .q-card.state-question .q-hint,
  .q-card.state-answer .q-hint {
    opacity: 0;
    height: 0;
    overflow: hidden;
    margin: 0;
    padding: 0;
  }

  .q-text-wrap {
    overflow: hidden;
    max-height: 0;
    opacity: 0;
    transition: max-height 0.45s cubic-bezier(0.4, 0, 0.2, 1),
                opacity 0.35s ease;
  }
  .q-card.state-question .q-text-wrap,
  .q-card.state-answer .q-text-wrap {
    max-height: 500px;
    opacity: 1;
  }

  .q-text {
    font-size: clamp(1.3rem, 3vw, 1.85rem);
    font-weight: 700;
    line-height: 1.4;
    color: var(--text);
    padding-top: 0.75rem;
  }

  .q-reveal-btn {
    display: none;
    margin-top: 1.1rem;
    background: var(--active-accent, #555);
    color: #000;
    border: none;
    border-radius: 10px;
    font-size: clamp(0.95rem, 2vw, 1.1rem);
    font-weight: 800;
    padding: 0.65rem 1.4rem;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: filter 0.15s ease, transform 0.15s ease;
  }
  .q-reveal-btn:hover { filter: brightness(1.15); transform: scale(1.02); }
  .q-reveal-btn:active { transform: scale(0.98); }
  .q-card.state-question .q-reveal-btn { display: inline-flex; align-items: center; gap: 0.4rem; }

  .q-answer-wrap {
    overflow: hidden;
    max-height: 0;
    opacity: 0;
    transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1),
                opacity 0.4s ease 0.1s;
  }
  .q-card.state-answer .q-answer-wrap {
    max-height: 500px;
    opacity: 1;
  }

  .q-answer-divider {
    height: 2px;
    background: var(--active-accent, #555);
    opacity: 0.4;
    border-radius: 2px;
    margin: 1rem 0;
  }
  .q-answer-label {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-weight: 700;
    color: var(--active-accent, var(--muted));
    margin-bottom: 0.4rem;
  }
  .q-answer-text {
    font-size: clamp(1.5rem, 3.5vw, 2.2rem);
    font-weight: 900;
    color: var(--active-accent, #fff);
    line-height: 1.3;
  }

  /* ── RESET / NEXT CARD HINT ──────────────────────────── */
  .q-card-footer {
    display: none;
    padding: 0 clamp(1.1rem, 2.5vw, 1.6rem) 1rem;
    font-size: 0.85rem;
    color: var(--muted);
    font-style: italic;
  }
  .q-card.state-answer .q-card-footer { display: block; }

  /* ── SCROLLBAR ───────────────────────────────────────── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

  /* ── FOCUS ───────────────────────────────────────────── */
  .q-card:focus-visible { outline: 3px solid var(--active-accent, #fff); outline-offset: 2px; }

  /* ── RESET ALL BUTTON ────────────────────────────────── */
  .reset-bar {
    max-width: 860px;
    margin: 0 auto 1.5rem;
    width: 100%;
    display: flex;
    justify-content: flex-end;
  }
  .reset-btn {
    background: none;
    border: 1px solid #333;
    border-radius: 8px;
    color: var(--muted);
    font-size: 0.9rem;
    font-weight: 600;
    padding: 0.4rem 0.9rem;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .reset-btn:hover { border-color: #555; color: var(--text); }

  /* ── SCOREBOARD (HOME) ───────────────────────────── */
  .scoreboard-section {
    max-width: min(480px, 100%);
    margin: 2.5rem auto 0;
    width: 100%;
  }
  .scoreboard-heading {
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.9rem;
    text-align: center;
  }
  .team-list { display: flex; flex-direction: column; gap: 0.55rem; }
  .team-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--surface);
    border: 1px solid #252525;
    border-radius: 12px;
    padding: 0.55rem 0.75rem;
  }
  .team-name-input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    border-bottom: 1.5px solid transparent;
    color: var(--text);
    font-size: 1rem;
    font-weight: 600;
    font-family: inherit;
    padding: 0.15rem 0.25rem;
    outline: none;
    transition: border-color 0.15s;
  }
  .team-name-input:focus { border-bottom-color: var(--team-color, #d946ef); }
  .team-name-input::placeholder { color: #444; }
  .team-score {
    font-size: 1.45rem;
    font-weight: 900;
    min-width: 2.2rem;
    text-align: center;
    color: var(--team-color, #d946ef);
    letter-spacing: -0.5px;
  }
  .score-btn {
    width: 34px;
    height: 34px;
    border: 1px solid #333;
    border-radius: 9px;
    background: none;
    color: var(--text);
    font-size: 1.15rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.13s, border-color 0.13s, color 0.13s;
    flex-shrink: 0;
    line-height: 1;
  }
  .score-btn:hover { background: #222; }
  .score-btn.plus:hover  { border-color: #4ade80; color: #4ade80; }
  .score-btn.minus:hover { border-color: #f87171; color: #f87171; }
  .remove-btn {
    width: 28px;
    height: 28px;
    border: none;
    background: none;
    color: #3a3a3a;
    font-size: 0.95rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    transition: color 0.13s, background 0.13s;
    flex-shrink: 0;
  }
  .remove-btn:hover { color: #f87171; background: rgba(248,113,113,0.1); }
  .scoreboard-actions { margin-top: 0.7rem; }
  .add-team-btn {
    width: 100%;
    background: none;
    border: 1px dashed #333;
    border-radius: 10px;
    color: #555;
    font-size: 0.95rem;
    font-weight: 600;
    font-family: inherit;
    padding: 0.55rem 1rem;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .add-team-btn:hover:not(:disabled) { border-color: #666; color: var(--muted); }
  .add-team-btn:disabled { opacity: 0.25; cursor: not-allowed; }

  /* ── SCOREBOARD (GAME — sticky bottom bar) ───────── */
  .scoreboard-game {
    position: sticky;
    bottom: 0;
    background: var(--bg);
    border-top: 1px solid #1e1e1e;
    margin-top: 2rem;
    margin-left:  calc(-1 * clamp(1.5rem, 4vw, 3rem));
    margin-right: calc(-1 * clamp(1.5rem, 4vw, 3rem));
    padding: 0.65rem clamp(1.5rem, 4vw, 3rem);
    z-index: 9;
  }
  .scoreboard-game-inner {
    max-width: 860px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    gap: 0.45rem;
    align-items: stretch;
  }
  .team-chip {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    background: var(--surface);
    border: 1px solid #252525;
    border-radius: 10px;
    padding: 0.3rem 0.45rem 0.3rem 0.7rem;
    flex: 1 1 140px;
    min-width: 0;
  }
  .team-chip-name {
    flex: 1;
    min-width: 0;
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .team-chip-score {
    font-size: 1.1rem;
    font-weight: 900;
    color: var(--team-color, #d946ef);
    min-width: 1.6rem;
    text-align: center;
  }
  .chip-btn {
    width: 26px;
    height: 26px;
    border: 1px solid #2e2e2e;
    border-radius: 7px;
    background: none;
    color: var(--text);
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.12s, border-color 0.12s, color 0.12s;
    flex-shrink: 0;
    line-height: 1;
  }
  .chip-btn:hover { background: #222; }
  .chip-btn.plus:hover  { border-color: #4ade80; color: #4ade80; }
  .chip-btn.minus:hover { border-color: #f87171; color: #f87171; }
  .scoreboard-game-empty {
    font-size: 0.85rem;
    color: var(--muted);
    font-style: italic;
    padding: 0.2rem 0;
  }
</style>
</head>
<body>

<!-- THEME SELECTION SCREEN -->
<div id="theme-screen" class="screen" role="main">
  <h1 class="site-title">Pack Trivia</h1>
  <p style="text-align:center;color:#aaa;font-size:0.9rem;letter-spacing:0.06em;text-transform:uppercase;font-weight:600;margin-bottom:0.5rem;">Created for THE PACK nights &mdash; 2026</p>
  <p class="site-subtitle">Choose a Category</p>
  <div class="theme-grid" id="theme-grid" role="list"></div>

  <div class="scoreboard-section">
    <div class="scoreboard-heading">Scoreboard</div>
    <div class="team-list" id="team-list-home"></div>
    <div class="scoreboard-actions">
      <button class="add-team-btn" id="add-team-btn">+ Add Team</button>
    </div>
  </div>
</div>

<!-- QUESTION LIST SCREEN -->
<div id="question-screen" class="screen hidden" role="main" aria-live="polite">
  <div class="question-header">
    <button class="back-btn" id="back-btn" aria-label="Back to themes">&#8592; Back</button>
    <span class="header-theme-name" id="header-theme-name"></span>
    <span class="header-progress" id="header-progress"></span>
  </div>
  <div class="reset-bar">
    <button class="reset-btn" id="reset-btn">Reset All</button>
  </div>
  <div class="question-list" id="question-list" role="list"></div>

  <div class="scoreboard-game">
    <div class="scoreboard-game-inner" id="team-list-game"></div>
  </div>
</div>

<script>
'use strict';

/* ══════════════════════════════════════════════════

/* ══════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════ */
let activeTheme = null;       // THEMES entry
let cardStates = [];          // 'unrevealed' | 'question' | 'answer'

/* ══════════════════════════════════════════════════
   SCREENS
══════════════════════════════════════════════════ */
const themeScreen    = document.getElementById('theme-screen');
const questionScreen = document.getElementById('question-screen');
const themeGrid      = document.getElementById('theme-grid');
const questionList   = document.getElementById('question-list');
const headerName     = document.getElementById('header-theme-name');
const headerProgress = document.getElementById('header-progress');
const backBtn        = document.getElementById('back-btn');
const resetBtn       = document.getElementById('reset-btn');

function showThemeScreen() {
  questionScreen.classList.add('hidden');
  themeScreen.classList.remove('hidden');
  themeScreen.classList.remove('slide-out');
  document.documentElement.style.setProperty('--active-accent', '#fff');
  activeTheme = null;
}

function showQuestionScreen(theme) {
  activeTheme = theme;
  cardStates = theme.questions.map(() => 'unrevealed');
  document.documentElement.style.setProperty('--active-accent', theme.accent);
  headerName.textContent = theme.name;
  headerName.style.color = theme.accent;
  buildQuestionList(theme);
  updateProgress();
  themeScreen.classList.add('slide-out');
  questionScreen.classList.remove('hidden');
  questionScreen.scrollTop = 0;
}

/* ══════════════════════════════════════════════════
   THEME GRID
══════════════════════════════════════════════════ */
function buildThemeGrid() {
  themeGrid.innerHTML = '';
  THEMES.forEach(theme => {
    const card = document.createElement('div');
    card.className = 'theme-card';
    card.setAttribute('role', 'listitem');
    card.setAttribute('tabindex', '0');
    card.setAttribute('aria-label', `${theme.name} — ${theme.questions.length} questions`);
    card.style.setProperty('--card-accent', theme.accent);
    card.innerHTML = `
      <span class="theme-icon" aria-hidden="true">${theme.icon}</span>
      <div class="theme-name">${theme.name}</div>
      <div class="theme-count">${theme.questions.length} questions</div>
      <span class="theme-card-arrow" aria-hidden="true">→</span>
    `;
    const activate = () => showQuestionScreen(theme);
    card.addEventListener('click', activate);
    card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(); } });
    themeGrid.appendChild(card);
  });
}

/* ══════════════════════════════════════════════════
   QUESTION LIST
══════════════════════════════════════════════════ */
function buildQuestionList(theme) {
  questionList.innerHTML = '';
  theme.questions.forEach((item, idx) => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.setAttribute('role', 'listitem');
    card.setAttribute('tabindex', '0');
    card.dataset.idx = idx;
    card.innerHTML = `
      <div class="q-card-inner">
        <div class="q-card-top">
          <span class="q-number">Q${idx + 1}</span>
          <span class="q-hint">Tap to reveal question</span>
        </div>
        <div class="q-text-wrap">
          <div class="q-text">${escapeHtml(item.q)}</div>
          <button class="q-reveal-btn" aria-label="Reveal answer to question ${idx + 1}">
            Reveal Answer ✦
          </button>
          <div class="q-answer-wrap">
            <div class="q-answer-divider"></div>
            <div class="q-answer-label">Answer</div>
            <div class="q-answer-text">${escapeHtml(item.a)}</div>
          </div>
        </div>
      </div>
      <div class="q-card-footer">Tap again to collapse</div>
    `;

    // Click on card → advance state (unrevealed → question, answer → unrevealed)
    card.addEventListener('click', e => {
      if (e.target.closest('.q-reveal-btn')) return; // handled separately
      advanceCardState(idx, card);
    });
    card.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        if (e.target.closest('.q-reveal-btn')) return;
        e.preventDefault();
        advanceCardState(idx, card);
      }
    });

    // Reveal answer button
    const revealBtn = card.querySelector('.q-reveal-btn');
    revealBtn.addEventListener('click', e => {
      e.stopPropagation();
      setCardState(idx, card, 'answer');
    });

    questionList.appendChild(card);
    applyCardState(idx, card); // initial state
  });
}

function advanceCardState(idx, card) {
  const current = cardStates[idx];
  if (current === 'unrevealed') {
    setCardState(idx, card, 'question');
  } else if (current === 'question') {
    setCardState(idx, card, 'answer');
  } else {
    setCardState(idx, card, 'unrevealed');
  }
}

function setCardState(idx, card, state) {
  cardStates[idx] = state;
  applyCardState(idx, card);
  updateProgress();
}

function applyCardState(idx, card) {
  const state = cardStates[idx];
  card.classList.remove('state-unrevealed', 'state-question', 'state-answer');
  card.classList.add(`state-${state}`);
  const hint = card.querySelector('.q-hint');
  if (state === 'unrevealed') {
    hint.textContent = 'Tap to reveal question';
    hint.style.display = '';
  } else {
    hint.style.display = 'none';
  }
}

function updateProgress() {
  if (!activeTheme) return;
  const revealed = cardStates.filter(s => s === 'answer').length;
  const total = activeTheme.questions.length;
  headerProgress.textContent = `${revealed}/${total} answered`;
}

/* ══════════════════════════════════════════════════
   CONTROLS
══════════════════════════════════════════════════ */
backBtn.addEventListener('click', showThemeScreen);

resetBtn.addEventListener('click', () => {
  if (!activeTheme) return;
  cardStates = activeTheme.questions.map(() => 'unrevealed');
  const cards = questionList.querySelectorAll('.q-card');
  cards.forEach((card, idx) => applyCardState(idx, card));
  updateProgress();
  questionScreen.scrollTop = 0;
});

/* ══════════════════════════════════════════════════
   UTILITY
══════════════════════════════════════════════════ */
function escapeHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/* ══════════════════════════════════════════════════
   TEAM MANAGEMENT
══════════════════════════════════════════════════ */
const MAX_TEAMS = 6;
const STORAGE_KEY = 'triviaTeams';
const TEAM_COLORS = ['#d946ef', '#f97316', '#22d3ee', '#4ade80', '#facc15', '#f87171'];

function loadTeams() {
  try { return JSON.parse(sessionStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}

function saveTeams(teams) {
  sessionStorage.setItem(STORAGE_KEY, JSON.stringify(teams));
}

function addTeam() {
  const teams = loadTeams();
  if (teams.length >= MAX_TEAMS) return;
  teams.push({ name: '', score: 0 });
  saveTeams(teams);
  renderHomeScoreboard();
  renderGameScoreboard();
  // focus the new input
  const inputs = document.querySelectorAll('#team-list-home .team-name-input');
  if (inputs.length) inputs[inputs.length - 1].focus();
}

function removeTeam(idx) {
  const teams = loadTeams();
  teams.splice(idx, 1);
  saveTeams(teams);
  renderHomeScoreboard();
  renderGameScoreboard();
}

function updateTeamName(idx, name) {
  const teams = loadTeams();
  if (teams[idx] !== undefined) teams[idx].name = name;
  saveTeams(teams);
  renderGameScoreboard();
}

function adjustScore(idx, delta) {
  const teams = loadTeams();
  if (teams[idx] !== undefined) {
    teams[idx].score = teams[idx].score + delta;
    saveTeams(teams);
    renderHomeScoreboard(idx);
    renderGameScoreboard();
  }
}

function renderHomeScoreboard(focusIdx) {
  const teams = loadTeams();
  const list = document.getElementById('team-list-home');
  const addBtn = document.getElementById('add-team-btn');
  list.innerHTML = '';

  teams.forEach((team, idx) => {
    const row = document.createElement('div');
    row.className = 'team-row';
    row.style.setProperty('--team-color', TEAM_COLORS[idx % TEAM_COLORS.length]);
    row.innerHTML = `
      <input class="team-name-input" type="text" placeholder="Team ${idx + 1}" maxlength="24"
             aria-label="Team ${idx + 1} name" value="${escapeAttr(team.name)}">
      <span class="team-score">${team.score}</span>
      <button class="score-btn plus"  aria-label="Add point to team ${idx + 1}">+</button>
      <button class="score-btn minus" aria-label="Subtract point from team ${idx + 1}">&#8722;</button>
      <button class="remove-btn"      aria-label="Remove team ${idx + 1}">&#10005;</button>
    `;
    const input = row.querySelector('.team-name-input');
    input.addEventListener('input', () => updateTeamName(idx, input.value));
    row.querySelector('.score-btn.plus').addEventListener('click',  () => adjustScore(idx,  1));
    row.querySelector('.score-btn.minus').addEventListener('click', () => adjustScore(idx, -1));
    row.querySelector('.remove-btn').addEventListener('click', () => removeTeam(idx));
    list.appendChild(row);
  });

  addBtn.disabled = teams.length >= MAX_TEAMS;
  addBtn.textContent = teams.length >= MAX_TEAMS ? 'Max 6 teams reached' : '+ Add Team';
}

function renderGameScoreboard() {
  const teams = loadTeams();
  const inner = document.getElementById('team-list-game');
  inner.innerHTML = '';

  if (teams.length === 0) {
    inner.innerHTML = '<span class="scoreboard-game-empty">No teams — add teams on the home screen.</span>';
    return;
  }

  teams.forEach((team, idx) => {
    const chip = document.createElement('div');
    chip.className = 'team-chip';
    chip.style.setProperty('--team-color', TEAM_COLORS[idx % TEAM_COLORS.length]);
    const displayName = escapeHtml(team.name.trim() || `Team ${idx + 1}`);
    chip.innerHTML = `
      <span class="team-chip-name">${displayName}</span>
      <span class="team-chip-score">${team.score}</span>
      <button class="chip-btn minus" aria-label="Subtract point from ${displayName}">&#8722;</button>
      <button class="chip-btn plus"  aria-label="Add point to ${displayName}">+</button>
    `;
    chip.querySelector('.chip-btn.plus').addEventListener('click',  () => adjustScore(idx,  1));
    chip.querySelector('.chip-btn.minus').addEventListener('click', () => adjustScore(idx, -1));
    inner.appendChild(chip);
  });
}

function escapeAttr(str) {
  return (str || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;');
}

document.getElementById('add-team-btn').addEventListener('click', addTeam);

/* ══════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════ */
buildThemeGrid();
renderHomeScoreboard();
renderGameScoreboard();
</script>
</body>
</html>
